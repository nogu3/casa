# Sample casa config file. All values are dummies (RFC 5737 192.0.2.0/24).
# Manage your real config in a separate repository and place it at ~/.config/casa/devices.toml.

version = 1

[devices.living_aircon]
protocol = "echonet"
ip = "192.0.2.10"
eoj = "0x013001"

[devices.bedroom_light]
protocol = "echonet"
ip = "192.0.2.11"
eoj = "0x029101"

[devices.entry_lock]
protocol = "switchbot"
device_id = "DUMMY-XX-XX"

# Matter device. node_id is the identifier of a commissioned node (dummy here).
# endpoint is an optional override for the on/off shortcut (defaults to mat's default of 1 if unset).
[devices.living_light]
protocol = "matter"
node_id = "1234"

[devices.power_strip_outlet2]
protocol = "matter"
node_id = "5678"
endpoint = 2
