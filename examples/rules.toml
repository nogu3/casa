# Sample casad rules file. Referenced devices correspond to the names in examples/devices.toml.
# Authors are expected to be LLMs / UIs (hand-authoring by humans is not assumed, but readability for direct inspection is kept).

version = 1

# Optional engine settings (defaults shown). An event-triggered `off` is held for
# off_grace_secs and discarded if an `on` for the same device arrives in the
# meantime (the device never sees a rapid off→on pair); time-triggered `off`s are
# exempt and fire immediately. min_gap_secs is the minimum interval between
# consecutive commands sent to the same device. Set to 0 to disable either.
[settings]
off_grace_secs = 30
min_gap_secs = 2

# Event trigger: when living_aircon's EPC 0x80 (power) becomes 0x30 (ON), turn on the bedroom light.
[[rules]]
name = "bedroom light ON when aircon starts"
when = { device = "living_aircon", epc = "0x80", equals = "0x30" }
then = { action = "on", device = "bedroom_light" }

# Time trigger: turn off the bedroom light every day at 22:00.
[[rules]]
name = "bedroom light off at 22:00"
when = { at = "22:00" }
then = { action = "off", device = "bedroom_light" }

# Matter attribute trigger: when living_light's onoff attribute becomes true, ... (mat listen via matd).
# equals is compared against the event's JSON value (number / bool / string).
[[rules]]
name = "example matter attribute trigger"
when = { device = "living_light", attribute = "onoff", equals = true }
then = { action = "on", device = "bedroom_light" }

# Matter device event trigger (mat 1.36.0+): fire on an event line from mat listen
# (`event` key) instead of an attribute change. `data` is optional and a partial
# match: only the keys you write are compared (as JSON values, type included);
# other keys in the event are ignored. Omit `data` to match on the event name alone.
# `data = {}` is a config error.
[[rules]]
name = "example double press turns off the bedroom light"
when = { device = "wall_switch", event = "multi-press-complete", data = { "total-number-of-presses-counted" = 2 } }
then = { action = "off", device = "bedroom_light" }

[[rules]]
name = "example log when the sensor reboots"
when = { device = "door_sensor", event = "start-up" }
then = { action = "invoke", device = "bedroom_light", command = "color-temp", args = ["--kelvin", "2700"] }

# Multiple actions for one trigger. Same-device actions keep declaration order;
# different-device actions run in parallel. `then = []` is a config error.
[[rules]]
name = "example multiple actions"
when = { at = "07:00" }
then = [
  { action = "on", device = "bedroom_light" },
  { action = "invoke", device = "bedroom_light", command = "color-temp", args = ["--kelvin", "2700"] },
]

# Lane: rules that share a `lane` run their actions on one queue, in declaration
# order, one at a time — even across different devices. A second rule in the same
# lane waits until the first rule's actions have finished, so the two never
# interleave. Useful for devices behind a relay that handles one command at a time.
# Off-grace does not apply to lane rules; min-gap still spaces repeated commands to
# the same device.
[[rules]]
name = "example lane: lights off one by one"
when = { at = "23:00" }
lane = "lights"
then = [
  { action = "off", device = "living_light" },
  { action = "off", device = "bedroom_light" },
]

# Active window: this rule is only in effect between 06:00 and 21:00. The start is
# inclusive and the end is exclusive, so it is already inactive at 21:00 sharp.
# `from` later than `to` wraps over midnight (e.g. from = "21:00", to = "06:00").
# Omit `active` entirely and the rule is in effect at all times.
[[rules]]
name = "example rule limited to daytime"
when = { device = "living_light", attribute = "onoff", equals = false }
active = { from = "06:00", to = "21:00" }
then = { action = "on", device = "bedroom_light" }
