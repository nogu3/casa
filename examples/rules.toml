# Sample casad rules file. Referenced devices correspond to the names in examples/devices.toml.
# Authors are expected to be LLMs / UIs (hand-authoring by humans is not assumed, but readability for direct inspection is kept).

version = 1

# Event trigger: when living_aircon's EPC 0x80 (power) becomes 0x30 (ON), turn on the bedroom light.
[[rules]]
name = "bedroom light ON when aircon starts"
when = { device = "living_aircon", epc = "0x80", equals = "0x30" }
then = { action = "on", device = "bedroom_light" }

# Time trigger: turn off the bedroom light every day at 22:00.
[[rules]]
name = "bedroom light off at 22:00"
when = { at = "22:00" }
then = { action = "off", device = "bedroom_light" }

# Matter event trigger: when living_light's onoff attribute becomes true, ... (mat listen via matd).
# equals is compared against the event's JSON value (number / bool / string).
[[rules]]
name = "example matter event trigger"
when = { device = "living_light", attribute = "onoff", equals = true }
then = { action = "on", device = "bedroom_light" }

# Multiple actions for one trigger. Same-device actions keep declaration order;
# different-device actions run in parallel. `then = []` is a config error.
[[rules]]
name = "example multiple actions"
when = { at = "07:00" }
then = [
  { action = "on", device = "bedroom_light" },
  { action = "invoke", device = "bedroom_light", command = "color-temp", args = ["--kelvin", "2700"] },
]

# Active window: this rule is only in effect between 06:00 and 21:00. The start is
# inclusive and the end is exclusive, so it is already inactive at 21:00 sharp.
# `from` later than `to` wraps over midnight (e.g. from = "21:00", to = "06:00").
# Omit `active` entirely and the rule is in effect at all times.
[[rules]]
name = "example rule limited to daytime"
when = { device = "living_light", attribute = "onoff", equals = false }
active = { from = "06:00", to = "21:00" }
then = { action = "on", device = "bedroom_light" }
