# casad ルールファイルのサンプル。参照デバイスは examples/devices.toml の名前に対応。
# 書き手は LLM / UI を想定（人間の手書きは前提にしないが、直接覗ける可読性は確保する）。

version = 1

# イベントトリガ: living_aircon の EPC 0x80（電源）が 0x30（ON）になったら寝室灯を点ける。
[[rules]]
name = "エアコン起動で寝室灯ON"
when = { device = "living_aircon", epc = "0x80", equals = "0x30" }
then = { action = "on", device = "bedroom_light" }

# 時刻トリガ: 毎日 22:00 に寝室灯を消す。
[[rules]]
name = "22時に寝室消灯"
when = { at = "22:00" }
then = { action = "off", device = "bedroom_light" }
