[package]
name = "casad"
description = "Resident layer on top of casa. Provides a DSL rule engine (time / event triggers → actions). Links casa-core and runs casa as a child process for real-device actions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "casad"
path = "src/main.rs"

[dependencies]
casa-core = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
