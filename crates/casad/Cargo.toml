[package]
name = "casad"
description = "casa 上の常駐レイヤ。DSL ルールエンジン（時刻 / イベントトリガ → アクション）を担う。casa-core を link し、実機アクションは casa を子プロセスとして起動する。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "casad"
path = "src/main.rs"

[dependencies]
casa-core = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
