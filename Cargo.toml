[workspace]
resolver = "2"
members = ["crates/casa-core", "crates/casa", "crates/casad"]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nogu3/casa"

[workspace.dependencies]
casa-core = { path = "crates/casa-core" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
